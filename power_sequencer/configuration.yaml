# ============================================================================
# Power Sequencer Configuration for Home Assistant
# 電源時序器 Home Assistant 設定
#
# Add this content to your /config/configuration.yaml
# 將此內容加入到 /config/configuration.yaml
#
# Prerequisites / 前置條件:
#   1. Copy power_sequencer.py to /config/scripts/power_sequencer.py
#      複製 power_sequencer.py 到 /config/scripts/power_sequencer.py
#   2. Restart Home Assistant / 重啟 Home Assistant
# ============================================================================

# --- Shell Commands for Power Sequencer ---
# These send RS232 hex commands via the helper script
# 透過輔助腳本發送 RS232 hex 指令

shell_command:
  # Individual channel control / 個別通道控制
  power_seq_ch1_on:  "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 1 on"
  power_seq_ch1_off: "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 1 off"
  power_seq_ch2_on:  "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 2 on"
  power_seq_ch2_off: "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 2 off"
  power_seq_ch3_on:  "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 3 on"
  power_seq_ch3_off: "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 3 off"
  power_seq_ch4_on:  "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 4 on"
  power_seq_ch4_off: "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 4 off"
  power_seq_ch5_on:  "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 5 on"
  power_seq_ch5_off: "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 5 off"
  power_seq_ch6_on:  "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 6 on"
  power_seq_ch6_off: "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 6 off"
  power_seq_ch7_on:  "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 7 on"
  power_seq_ch7_off: "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 7 off"
  power_seq_ch8_on:  "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 8 on"
  power_seq_ch8_off: "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 8 off"
  # Bulk control / 批次控制
  power_seq_all_on:  "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 0 on"
  power_seq_all_off: "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 0 off"
  power_seq_seq_on:  "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 13 on"
  power_seq_seq_off: "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 13 off"
  power_seq_sim_on:  "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 16 on"
  power_seq_sim_off: "python3 /config/scripts/power_sequencer.py /dev/ttyUSB0 1 16 off"

# --- Template Switches (appear as plug entities in dashboard) ---
# Optimistic mode: state tracked in HA (device has no status feedback)
# 樂觀模式：狀態由 HA 追蹤（裝置無狀態回饋）

switch:
  - platform: template
    switches:
      power_sequencer_ch1:
        friendly_name: "Power Sequencer Ch1"
        unique_id: power_sequencer_ch1
        icon_template: "mdi:power-plug"
        turn_on:
          service: shell_command.power_seq_ch1_on
        turn_off:
          service: shell_command.power_seq_ch1_off

